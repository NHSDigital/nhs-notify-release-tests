name: Build Release Test Image
run-name: Build Release Test Image << ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag. Defaults to the current commit SHA.
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: build-release-test-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_release_test_image:
    name: Build Release Test Image
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-2
      ECR_REPOSITORY: release-tests
      IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
      MGMT_ACCT_ID: ${{ vars.MGMT_ACCT_ID }}
    outputs:
      image_tag: ${{ steps.publish_image.outputs.image_tag }}
      image_uri: ${{ steps.publish_image.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: arn:aws:iam::${{ vars.MGMT_ACCT_ID }}:role/service-role/${{ vars.AWS_ASSUME_ROLE_NAME }}
          role-session-name: ${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true
          mask-aws-account-id: 'false'

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@183a1442edf41672e66566b7fc560e297a290896 # v2.1.1

      - name: Build and push release test image
        id: publish_image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          image_tag="${IMAGE_TAG_INPUT:-${GITHUB_SHA}}"
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${image_tag}"

          docker build --tag "${image_uri}" .
          docker push "${image_uri}"

          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${image_uri}" >> "$GITHUB_OUTPUT"

      - name: Summarize image
        run: |
          {
            echo "## Release Test Image"
            echo
            echo "- Image URI: ${{ steps.publish_image.outputs.image_uri }}"
            echo "- Ref: ${{ github.ref_name }}"
            echo "- Commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"